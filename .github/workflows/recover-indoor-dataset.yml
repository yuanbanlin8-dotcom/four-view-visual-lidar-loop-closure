name: Recover indoor dataset
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Verify and stage dataset assets
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ASSETS: ${{ secrets.DATASET_RECOVERY_URLS }}
        shell: python
        run: |
          import os, json, hashlib, urllib.request, urllib.error, time, tarfile, io
          from pathlib import Path
          
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          assets = json.loads(os.environ['SOURCE_ASSETS'])
          root = Path(os.environ['RUNNER_TEMP']) / 'dataset-recovery'
          root.mkdir(exist_ok=True)
          def api(path, data=None, method='GET'):
              req = urllib.request.Request('https://api.github.com/' + path,
                  data=json.dumps(data).encode() if data is not None else None, method=method,
                  headers={'Authorization': 'Bearer '+token, 'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json', 'User-Agent': 'dataset-recovery'})
              with urllib.request.urlopen(req, timeout=90) as r: return json.load(r)
          
          for a in assets:
              f = root / a['name']
              print('Downloading', a['name'], a['size'], flush=True)
              for attempt in range(3):
                  try:
                      h = hashlib.sha256(); size = 0
                      with urllib.request.urlopen(a['url'], timeout=120) as r, f.open('wb') as out:
                          while chunk := r.read(1024*1024):
                              out.write(chunk); h.update(chunk); size += len(chunk)
                      assert size == a['size'] and h.hexdigest() == a['sha256'], a['name']
                      break
                  except Exception as e:
                      print('Retry', a['name'], attempt+1, type(e).__name__, flush=True)
                      if attempt == 2: raise RuntimeError('Download failed: '+a['name']) from None
                      time.sleep(3)
              print('Verified asset', a['name'], flush=True)
          
          expected = {}
          for line in (root/'ORIGINAL_SHA256SUMS.txt').read_text().splitlines():
              digest, name = line.split('  ', 1); expected[name.removeprefix('./')] = digest
          
          class Parts(io.RawIOBase):
              def __init__(self, paths): self.paths=iter(paths); self.current=None
              def readable(self): return True
              def read(self, n=-1):
                  assert n >= 0
                  chunks=[]; remaining=n
                  while remaining:
                      if self.current is None:
                          try: self.current=next(self.paths).open('rb')
                          except StopIteration: break
                      b=self.current.read(remaining)
                      if not b: self.current.close(); self.current=None; continue
                      chunks.append(b); remaining-=len(b)
                  return b''.join(chunks)
          
          inventory=[]; matched=set(); suspicious=[]
          with tarfile.open(fileobj=Parts(sorted(root.glob('recording.tar.gz.part-*'))), mode='r|gz') as t:
              for m in t:
                  if not m.isfile(): continue
                  name=m.name.removeprefix('./').split('/',1)[-1]
                  h=hashlib.sha256()
                  with t.extractfile(m) as f:
                      while chunk:=f.read(1024*1024): h.update(chunk)
                  digest=h.hexdigest()
                  assert name in expected and digest==expected[name], m.name
                  matched.add(name); inventory.append({'name':m.name,'size':m.size,'sha256':digest})
          assert matched == set(expected), sorted(set(expected)-matched)
          print('Verified original recording files:', len(inventory), flush=True)
          for archive in ['analysis.tar.gz','audits.tar.gz']:
              count=0; total=0
              with tarfile.open(root/archive,mode='r|gz') as t:
                  for m in t:
                      if not m.isfile(): continue
                      count+=1;total+=m.size
                      base=Path(m.name).name.lower()
                      if base in ['.env','id_rsa','id_ed25519','credentials','credentials.json'] or base.endswith(('.pem','.key')):
                          suspicious.append({'archive':archive,'path':m.name})
              print('Archive inventory',archive,count,'files',total,'bytes',flush=True)
          assert not suspicious, 'Credential-like files need review: '+json.dumps(suspicious)
          report={'recording':'20261008_145008','original_files_verified':len(inventory),'files':inventory,
                  'assets':[{'name':a['name'],'size':a['size'],'sha256':a['sha256']} for a in assets]}
          (root/'VERIFIED_INVENTORY.json').write_text(json.dumps(report,indent=2))
          body='''Single-floor indoor recording acquired on 8 October 2026 (20261008_145008), using four cameras and a Livox MID-360.
          
          Contents:
          - `recording.tar.gz.part-00` through `part-03`: original recording directory, including `images_0.bag`, `sensors_0.bag`, `map_raw.pcd`, `map_5cm.pcd`, `trajectory.txt`, runtime configuration and logs.
          - `analysis.tar.gz`: historical offline analysis outputs and caches, including V6–V13 variants.
          - `audits.tar.gz`: recording audit records.
          - `SHA256SUMS.txt`: archive-part checksums.
          - `ORIGINAL_SHA256SUMS.txt`: checksums of all 17 files in the recording directory.
          - `VERIFIED_INVENTORY.json`: file sizes and verified checksums.
          
          Download every attachment into one directory. Restore on Linux:
          ```bash
          sha256sum -c SHA256SUMS.txt
          cat recording.tar.gz.part-00 recording.tar.gz.part-01 recording.tar.gz.part-02 recording.tar.gz.part-03 | tar -xz
          tar -xzf analysis.tar.gz
          tar -xzf audits.tar.gz
          (cd 20261008_145008 && sha256sum -c ../ORIGINAL_SHA256SUMS.txt)
          ```
          Paper experiment outputs and the current implementation are indexed in DATA.md and REPRODUCIBILITY.md on the main branch.
          '''
          release=api('repos/'+repo+'/releases', {'tag_name':'dataset-20261008-floor1','target_commitish':os.environ['GITHUB_SHA'],
              'name':'Single-floor indoor dataset — 2026-10-08','body':body,'draft':True,'prerelease':False}, 'POST')
          upload=release['upload_url'].split('{')[0]
          for f in [root/a['name'] for a in assets]+[root/'VERIFIED_INVENTORY.json']:
              print('Uploading', f.name,flush=True)
              with f.open('rb') as data:
                  req=urllib.request.Request(upload+'?name='+f.name,data=data,method='POST',
                      headers={'Authorization':'Bearer '+token,'Content-Type':'application/octet-stream',
                               'Content-Length':str(f.stat().st_size),'User-Agent':'dataset-recovery'})
                  with urllib.request.urlopen(req,timeout=1800) as response: result=json.load(response)
              digest='sha256:'+hashlib.sha256(f.read_bytes()).hexdigest() if f.name=='VERIFIED_INVENTORY.json' else 'sha256:'+next(a['sha256'] for a in assets if a['name']==f.name)
              assert result.get('digest')==digest and result['size']==f.stat().st_size, f.name
              print('Uploaded and verified',f.name,flush=True)
          print('DRAFT_RELEASE_ID',release['id'],flush=True)
          print(json.dumps(report,indent=2),flush=True)
