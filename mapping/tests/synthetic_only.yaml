  - 0.0
  - 0.0
  - 0.0
imu:
  acc_cov: 0.6
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  gyr_cov: 0.3
  imu_en: true
  imu_int_frame: 30
lio:
  beam_err: 0.05
  dept_err: 0.02
  layer_init_num:
  - 5
  - 5
  - 5
  - 5
  - 5
  max_iterations: 5
  max_layer: 2
  max_points_num: 100
  min_eigen_value: 0.0025
  voxel_size: 1.0
local_map:
  half_map_size: 50
  map_sliding_en: true
  max_visual_voxels: 10000
  sliding_thresh: 4
pcd_save:
  colmap_output_en: false
  filter_size_pcd: 0.1
  interval: -1
  pcd_save_en: false
preprocess:
  blind: 0.5
  filter_size_surf: 0.5
  lidar_type: 1
  point_filter_num: 1
  scan_line: 4
publish:
  blind_rgb_points: 0.0
  dense_map_en: true
  pub_effect_point_en: false
  pub_plane_en: false
  pub_scan_num: 1
time_offset:
  exposure_time_init: 0.0
  img_time_offset: 0.0
  imu_time_offset: 0.0
uav:
  gravity_align_en: false
  imu_rate_odom: false
vio:
  dynamic_cov_error_max: 100
  enable_cross_camera_tracking: true
  enable_dynamic_covariance: false
  exposure_estimate_en: true
  img_point_cov: 100
  inv_expo_cov: 0.1
  inverse_composition_en: false
  max_cov_scale: 2000.0
  max_iterations: 5
  max_total_points: 150
  min_cov_scale: 500.0
  normal_en: true
  outlier_threshold: 100
  patch_pyrimid_level: 3
  patch_size: 4
  raycast_en: false
